<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>60 urodziny — 07.11.2026</title>
<meta name="description" content="60 urodziny — Wrocław Golf Club, 7 listopada 2026. Informacje i potwierdzenie obecności.">
<meta name="theme-color" content="#233B25">
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bona+Nova:ital,wght@0,400;0,700;1,400&family=Bona+Nova+SC:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* ── Tokeny — z zaproszenia (Figma 2008:539) ─────────────────────────── */
  /* Zieleń wzięta z RENDERU, nie z fillu w kodzie: pod spodem jest #042406,
     ale leży na nim tekstura, która realnie daje #233B25. Tekst na
     zaproszeniu jest czysto biały — tu celowo masełkowy. */
  :root {
    --bg:        #233B25;                    /* zieleń jak na renderze Figmy */
    --fg:        #F2E7CC;                    /* masełkowy tekst */
    --fg-strong: #FAF4E4;                    /* jaśniejszy masełkowy — duża typografia */
    --muted:     rgba(242, 231, 204, 0.66);
    --rule:      rgba(242, 231, 204, 0.22);
    --rule-strong: rgba(242, 231, 204, 0.48);
    --warn:      #E9B489;                    /* komunikaty błędów na zieleni */

    /* Antic Didone z zaproszenia NIE ma latin-ext — ą ć ę ł ń ś ź ż spadały
       na Georgię. Bodoni Moda ma polski komplet, ale w didonie kreska ł jest
       włosowa i w tekście „bezpłatny" czytało się jak „bezplatny".
       Bona Nova (ten sam superrodzina co display, krój Andrzeja Heidricha,
       projektowany pod polską typografię) ma najwyraźniejsze diakrytyki
       z testowanych — pomiar: kreska ł to 13,4% masy znaku wobec 8,3% w Bodoni. */
    --display: 'Bona Nova SC', Georgia, serif;
    --serif:   'Bona Nova', Georgia, serif;
    --sans:    'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;

    --pad-x: 56px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    /* Ziarno odwzorowane z renderu zaproszenia — kafel 128×128 z szumem
       per-piksel o zmierzonej amplitudzie. Kolor jest już w kafelku,
       background-color zostaje jako fallback, gdyby PNG nie wstał. */
    background-color: var(--bg);
    background-image: url("img/grain.png");
    background-repeat: repeat;
    color: var(--fg);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh;
  }

  .smallcaps {
    font-family: var(--sans);
    text-transform: uppercase;
    letter-spacing: 0.18em;
    font-size: 11px;
    font-weight: 500;
  }
  .display { font-family: var(--display); }
  .serif   { font-family: var(--serif); }

  ::selection { background: var(--fg); color: var(--bg); }

  h1, h2, h3 { font-family: var(--display); font-weight: 400; }
  h1 em, h2 em, h3 em, h4 em { font-weight: 400; font-style: italic; }

  button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible {
    outline: 2px solid var(--fg);
    outline-offset: 4px;
  }

  input::placeholder, textarea::placeholder { color: var(--muted); opacity: 0.55; }
  input, textarea { color-scheme: dark; }

  /* ── Responsywność ───────────────────────────────────────────────────── */
  @media (max-width: 768px) {
    :root { --pad-x: 22px; }
    body { font-size: 14px; }

    .stack-mobile { display: block !important; }
    .stack-mobile > * + * { margin-top: 40px !important; }

    .stack-mobile-tight { grid-template-columns: 1fr !important; gap: 6px !important; }

    /* Trzy hasła: na wąskim ekranie jedno pod drugim, bo przy zawijaniu
       w rzędzie zostawała wisząca kreska rozdzielająca. */
    .badge-row { flex-direction: column !important; align-items: flex-start !important; gap: 12px !important; }
    .badge-row .badge-divider { display: none !important; }
  }
  @media (max-width: 420px) {
    :root { --pad-x: 16px; }
  }

  /* ── Po wysłaniu RSVP ────────────────────────────────────────────────── */
  @keyframes rsvp-rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes rsvp-rule {
    from { transform: scaleX(0); }
    to   { transform: scaleX(1); }
  }
  @keyframes rsvp-confetti {
    0%   { opacity: 0; transform: translate3d(0, -10px, 0) rotate(var(--r)); }
    12%  { opacity: 1; }
    80%  { opacity: 1; }
    100% { opacity: 0; transform: translate3d(var(--dx), var(--dy), 0) rotate(calc(var(--r) + 420deg)); }
  }

  .rsvp-rise { animation: rsvp-rise 620ms cubic-bezier(.2,.8,.2,1) both; }
  .rsvp-rule {
    transform-origin: left center;
    animation: rsvp-rule 720ms cubic-bezier(.2,.8,.2,1) 120ms both;
  }
  .rsvp-confetti-piece {
    position: absolute;
    top: 0;
    animation: rsvp-confetti var(--dur) cubic-bezier(.25,.6,.35,1) var(--delay) both;
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    /* Zostaje samo pojawienie się treści — bez ruchu i bez konfetti. */
    .rsvp-rise { animation: none; }
    .rsvp-rule { animation: none; }
    .rsvp-confetti { display: none; }
  }
</style>
</head>
